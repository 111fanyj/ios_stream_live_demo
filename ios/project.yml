name: IOSStreamViewer
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    branch: latest
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
schemes:
  IOSStreamViewer:
    build:
      targets:
        IOSStreamViewer: all
    run:
      config: Debug
    test:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
options:
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: "6RM2TN4K2V"
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.example.IOSStreamViewer
targets:
  IOSStreamViewer:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: IOSStreamViewer
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _iosstreamviewer._tcp
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: 用于将屏幕直播数据发送到本地或远端服务器。
    entitlements:
      path: App/IOSStreamViewer.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.IOSStreamViewer.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IOSStreamViewer
        CODE_SIGN_ENTITLEMENTS: App/IOSStreamViewer.entitlements
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: 1,2
    dependencies:
      - target: BroadcastUploadExtension
      - package: ZIPFoundation
  BroadcastUploadExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastUploadExtension/Sources
    dependencies:
      - package: WebRTC
    info:
      path: BroadcastUploadExtension/Info.plist
      properties:
        CFBundleDisplayName: IOSStreamViewer
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
    entitlements:
      path: BroadcastUploadExtension/BroadcastUploadExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.IOSStreamViewer.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IOSStreamViewer.BroadcastUploadExtension
        CODE_SIGN_ENTITLEMENTS: BroadcastUploadExtension/BroadcastUploadExtension.entitlements
        INFOPLIST_FILE: BroadcastUploadExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
    postBuildScripts:
      - name: Embed WebRTC Framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          FRAMEWORK_NAME="WebRTC.framework"
          SOURCE_PATH="${BUILT_PRODUCTS_DIR}/${FRAMEWORK_NAME}"
          DEST_DIR="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          DEST_PATH="${DEST_DIR}/${FRAMEWORK_NAME}"

          if [ ! -d "${SOURCE_PATH}" ]; then
            echo "error: Missing ${SOURCE_PATH}"
            exit 1
          fi

          mkdir -p "${DEST_DIR}"
          rm -rf "${DEST_PATH}"
          ditto "${SOURCE_PATH}" "${DEST_PATH}"

          if [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --preserve-metadata=identifier,entitlements "${DEST_PATH}"
          fi
