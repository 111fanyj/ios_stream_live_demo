name: IOSStreamViewer
options:
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.example.IOSStreamViewer
targets:
  IOSStreamViewer:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: 用于将屏幕直播数据发送到本地或远端服务器。
    entitlements:
      path: App/IOSStreamViewer.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IOSStreamViewer
        CODE_SIGN_ENTITLEMENTS: App/IOSStreamViewer.entitlements
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: 1,2
    dependencies:
      - target: BroadcastUploadExtension
  BroadcastUploadExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastUploadExtension/Sources
    info:
      path: BroadcastUploadExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
    entitlements:
      path: BroadcastUploadExtension/BroadcastUploadExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IOSStreamViewer.BroadcastUploadExtension
        CODE_SIGN_ENTITLEMENTS: BroadcastUploadExtension/BroadcastUploadExtension.entitlements
        INFOPLIST_FILE: BroadcastUploadExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        IPHONEOS_DEPLOYMENT_TARGET: 17.0