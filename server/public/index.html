<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iOS Screen Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5efe4;
        --surface: rgba(255, 252, 246, 0.92);
        --surface-strong: rgba(255, 255, 255, 0.98);
        --ink: #16233a;
        --muted: #5b6778;
        --accent: #ef6c3d;
        --accent-soft: #ffd8c9;
        --line: rgba(22, 35, 58, 0.12);
        --ok: #1d8a5f;
        --warn: #b26d00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Avenir Next", "Helvetica Neue", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(239, 108, 61, 0.16), transparent 28%),
          radial-gradient(circle at 85% 15%, rgba(29, 138, 95, 0.12), transparent 22%),
          linear-gradient(180deg, #fbf6ec 0%, var(--bg) 100%);
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .hero {
        display: grid;
        gap: 20px;
        margin-bottom: 24px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(30px, 6vw, 58px);
        line-height: 0.95;
        letter-spacing: -0.04em;
        max-width: 10ch;
      }

      .hero p {
        margin: 0;
        max-width: 58ch;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .panel-grid {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 20px;
      }

      .panel,
      .viewer {
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        backdrop-filter: blur(18px);
        box-shadow: 0 18px 45px rgba(22, 35, 58, 0.08);
      }

      .panel {
        padding: 22px;
      }

      .viewer {
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 70vh;
      }

      .viewer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-strong);
      }

      .viewer-stage {
        padding: 18px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(22, 35, 58, 0.02), rgba(22, 35, 58, 0.08)),
          repeating-linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.3),
            rgba(255, 255, 255, 0.3) 14px,
            rgba(255, 255, 255, 0.18) 14px,
            rgba(255, 255, 255, 0.18) 28px
          );
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--warn);
        box-shadow: 0 0 0 5px rgba(178, 109, 0, 0.12);
      }

      .dot.live {
        background: var(--ok);
        box-shadow: 0 0 0 5px rgba(29, 138, 95, 0.12);
      }

      label {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
        font-size: 14px;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px 14px;
        font: inherit;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.82);
      }

      button {
        width: 100%;
        padding: 14px 18px;
        border: 0;
        border-radius: 18px;
        font: inherit;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent), #ff965a);
        color: white;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .meta {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
        color: var(--muted);
        font-size: 14px;
      }

      .meta strong {
        color: var(--ink);
      }

      img {
        width: 100%;
        max-height: calc(70vh - 90px);
        object-fit: contain;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      .empty {
        display: grid;
        gap: 12px;
        text-align: center;
        padding: 32px;
        color: var(--muted);
      }

      .empty strong {
        font-size: 20px;
        color: var(--ink);
      }

      @media (max-width: 920px) {
        .panel-grid {
          grid-template-columns: 1fr;
        }

        .viewer {
          min-height: 58vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>iPhone 当前屏幕实时查看</h1>
        <p>
          这个页面作为查看端。iOS App 启动屏幕广播后，Broadcast Extension 会把屏幕帧通过 WebSocket 推送到服务端，这里实时展示最新画面。
        </p>
      </section>

      <section class="panel-grid">
        <aside class="panel">
          <label>
            服务端地址
            <input id="serverUrl" />
          </label>
          <label>
            房间 ID
            <input id="roomId" value="demo-room" />
          </label>
          <label>
            Token
            <input id="token" placeholder="可选，需与服务端环境变量一致" />
          </label>
          <button id="connectButton">连接查看</button>

          <div class="meta">
            <div>连接状态: <strong id="connectionState">未连接</strong></div>
            <div>发布端状态: <strong id="publisherState">未检测到</strong></div>
            <div>查看人数: <strong id="viewerCount">0</strong></div>
            <div>最新帧: <strong id="lastFrameMeta">暂无</strong></div>
          </div>
        </aside>

        <section class="viewer">
          <div class="viewer-head">
            <strong id="viewerTitle">房间 demo-room</strong>
            <span class="badge"><span id="statusDot" class="dot"></span><span id="statusLabel">等待直播</span></span>
          </div>
          <div class="viewer-stage">
            <div id="emptyState" class="empty">
              <strong>还没有收到画面</strong>
              <span>先在 iOS 端保存服务端地址，再从控制中心启动屏幕广播。</span>
            </div>
            <img id="frameView" hidden alt="Live screen frame" />
          </div>
        </section>
      </section>
    </main>

    <script>
      const serverUrlInput = document.getElementById('serverUrl');
      const roomIdInput = document.getElementById('roomId');
      const tokenInput = document.getElementById('token');
      const connectButton = document.getElementById('connectButton');
      const connectionState = document.getElementById('connectionState');
      const publisherState = document.getElementById('publisherState');
      const viewerCount = document.getElementById('viewerCount');
      const lastFrameMeta = document.getElementById('lastFrameMeta');
      const frameView = document.getElementById('frameView');
      const emptyState = document.getElementById('emptyState');
      const viewerTitle = document.getElementById('viewerTitle');
      const statusDot = document.getElementById('statusDot');
      const statusLabel = document.getElementById('statusLabel');

      let socket;

      function defaultServerUrl() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        return `${protocol}//${window.location.host}`;
      }

      serverUrlInput.value = defaultServerUrl();

      function setLiveState(isLive) {
        statusDot.classList.toggle('live', isLive);
        statusLabel.textContent = isLive ? '直播中' : '等待直播';
        publisherState.textContent = isLive ? '已连接' : '未检测到';
      }

      function setConnectionText(text) {
        connectionState.textContent = text;
      }

      function closeSocket() {
        if (socket) {
          socket.onclose = null;
          socket.close();
          socket = null;
        }
      }

      connectButton.addEventListener('click', () => {
        closeSocket();

        const baseUrl = serverUrlInput.value.trim().replace(/\/$/, '');
        const roomId = roomIdInput.value.trim() || 'demo-room';
        const token = tokenInput.value.trim();
        const url = new URL(baseUrl);

        if (url.protocol === 'http:') {
          url.protocol = 'ws:';
        }

        if (url.protocol === 'https:') {
          url.protocol = 'wss:';
        }

        url.searchParams.set('type', 'viewer');
        url.searchParams.set('roomId', roomId);
        if (token) {
          url.searchParams.set('token', token);
        }

        viewerTitle.textContent = `房间 ${roomId}`;
        setConnectionText('连接中');
        socket = new WebSocket(url);

        socket.onopen = () => {
          setConnectionText('已连接');
        };

        socket.onmessage = (event) => {
          const message = JSON.parse(event.data);

          if (message.type === 'room_state') {
            setLiveState(Boolean(message.hasPublisher));
            viewerCount.textContent = String(message.viewerCount || 0);
            return;
          }

          if (message.type === 'viewer_ready') {
            setLiveState(Boolean(message.hasPublisher));
            viewerCount.textContent = String(message.viewerCount || 0);
            return;
          }

          if (message.type === 'frame') {
            const dataUrl = `data:${message.mimeType};base64,${message.imageData}`;
            frameView.src = dataUrl;
            frameView.hidden = false;
            emptyState.hidden = true;
            lastFrameMeta.textContent = `${message.width || '?'} x ${message.height || '?'} / ${new Date(message.timestamp).toLocaleTimeString()}`;
            setLiveState(true);
            return;
          }

          if (message.type === 'error') {
            setConnectionText(`错误: ${message.message}`);
          }
        };

        socket.onerror = () => {
          setConnectionText('连接异常');
        };

        socket.onclose = () => {
          setConnectionText('已断开');
          setLiveState(false);
        };
      });
    </script>
  </body>
  </html>
