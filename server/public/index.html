<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iOS Screen Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5efe4;
        --surface: rgba(255, 252, 246, 0.92);
        --surface-strong: rgba(255, 255, 255, 0.98);
        --ink: #16233a;
        --muted: #5b6778;
        --accent: #ef6c3d;
        --accent-soft: #ffd8c9;
        --line: rgba(22, 35, 58, 0.12);
        --ok: #1d8a5f;
        --warn: #b26d00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Avenir Next", "Helvetica Neue", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(239, 108, 61, 0.16), transparent 28%),
          radial-gradient(circle at 85% 15%, rgba(29, 138, 95, 0.12), transparent 22%),
          linear-gradient(180deg, #fbf6ec 0%, var(--bg) 100%);
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .hero {
        display: grid;
        gap: 20px;
        margin-bottom: 24px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(30px, 6vw, 58px);
        line-height: 0.95;
        letter-spacing: -0.04em;
        max-width: 10ch;
      }

      .hero p {
        margin: 0;
        max-width: 58ch;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .panel-grid {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 20px;
      }

      .panel,
      .viewer {
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        backdrop-filter: blur(18px);
        box-shadow: 0 18px 45px rgba(22, 35, 58, 0.08);
      }

      .panel {
        padding: 22px;
      }

      .viewer {
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 70vh;
      }

      .viewer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-strong);
      }

      .viewer-stage {
        padding: 18px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(22, 35, 58, 0.02), rgba(22, 35, 58, 0.08)),
          repeating-linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.3),
            rgba(255, 255, 255, 0.3) 14px,
            rgba(255, 255, 255, 0.18) 14px,
            rgba(255, 255, 255, 0.18) 28px
          );
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--warn);
        box-shadow: 0 0 0 5px rgba(178, 109, 0, 0.12);
      }

      .dot.live {
        background: var(--ok);
        box-shadow: 0 0 0 5px rgba(29, 138, 95, 0.12);
      }

      label {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
        font-size: 14px;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px 14px;
        font: inherit;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.82);
      }

      button {
        width: 100%;
        padding: 14px 18px;
        border: 0;
        border-radius: 18px;
        font: inherit;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent), #ff965a);
        color: white;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .meta {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
        color: var(--muted);
        font-size: 14px;
      }

      .debug-log {
        margin-top: 18px;
        padding: 14px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(22, 35, 58, 0.04);
      }

      .debug-log h2 {
        margin: 0 0 10px;
        font-size: 14px;
        color: var(--ink);
      }

      .debug-log pre {
        margin: 0;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--ink);
      }

      .meta strong {
        color: var(--ink);
      }

      video {
        width: 100%;
        max-height: calc(70vh - 90px);
        object-fit: contain;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      .empty {
        display: grid;
        gap: 12px;
        text-align: center;
        padding: 32px;
        color: var(--muted);
      }

      .empty strong {
        font-size: 20px;
        color: var(--ink);
      }

      @media (max-width: 920px) {
        .panel-grid {
          grid-template-columns: 1fr;
        }

        .viewer {
          min-height: 58vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>iPhone 当前屏幕实时查看</h1>
        <p>
          这个页面作为查看端。iOS App 启动屏幕广播后，Broadcast Extension 会通过 WebRTC 视频轨道把实时画面直接发送到浏览器，这里直接播放远端视频流。
        </p>
      </section>

      <section class="panel-grid">
        <aside class="panel">
          <label>
            服务端地址
            <input id="serverUrl" />
          </label>
          <label>
            房间 ID
            <input id="roomId" value="demo-room" />
          </label>
          <label>
            Token
            <input id="token" placeholder="可选，需与服务端环境变量一致" />
          </label>
          <button id="connectButton">连接查看</button>

          <div class="meta">
            <div>信令状态: <strong id="connectionState">未连接</strong></div>
            <div>发布端状态: <strong id="publisherState">未检测到</strong></div>
            <div>WebRTC 状态: <strong id="rtcState">未建立</strong></div>
            <div>查看人数: <strong id="viewerCount">0</strong></div>
            <div>视频信息: <strong id="lastFrameMeta">暂无</strong></div>
          </div>

          <section class="debug-log">
            <h2>调试日志</h2>
            <pre id="debugLog">等待连接...</pre>
          </section>
        </aside>

        <section class="viewer">
          <div class="viewer-head">
            <strong id="viewerTitle">房间 demo-room</strong>
            <span class="badge"><span id="statusDot" class="dot"></span><span id="statusLabel">等待直播</span></span>
          </div>
          <div class="viewer-stage">
            <div id="emptyState" class="empty">
              <strong>还没有收到画面</strong>
              <span>先在 iOS 端保存服务端地址，再从控制中心启动屏幕广播。</span>
            </div>
            <video id="videoView" hidden autoplay playsinline muted></video>
          </div>
        </section>
      </section>
    </main>

    <script>
      const serverUrlInput = document.getElementById('serverUrl');
      const roomIdInput = document.getElementById('roomId');
      const tokenInput = document.getElementById('token');
      const connectButton = document.getElementById('connectButton');
      const connectionState = document.getElementById('connectionState');
      const publisherState = document.getElementById('publisherState');
      const rtcState = document.getElementById('rtcState');
      const viewerCount = document.getElementById('viewerCount');
      const lastFrameMeta = document.getElementById('lastFrameMeta');
      const videoView = document.getElementById('videoView');
      const emptyState = document.getElementById('emptyState');
      const viewerTitle = document.getElementById('viewerTitle');
      const statusDot = document.getElementById('statusDot');
      const statusLabel = document.getElementById('statusLabel');
      const debugLog = document.getElementById('debugLog');

      let signalingSocket;
      let peerConnection;
      let currentPublisherId = null;
      let hasRemoteDescription = false;
      let pendingCandidates = [];
      let debugLines = [];

      function defaultServerUrl() {
        return window.location.origin;
      }

      serverUrlInput.value = defaultServerUrl();

      async function attemptVideoPlayback(reason) {
        try {
          await videoView.play();
        } catch (error) {
          pushLog('video.play 失败', { reason, message: error.message });
        }
      }

      function updateVideoMeta() {
        const width = videoView.videoWidth || '?';
        const height = videoView.videoHeight || '?';
        lastFrameMeta.textContent = `${width} x ${height} / ${new Date().toLocaleTimeString()}`;
      }

      videoView.addEventListener('loadedmetadata', () => {
        updateVideoMeta();
        pushLog('视频元数据已加载', { width: videoView.videoWidth, height: videoView.videoHeight });
        attemptVideoPlayback('loadedmetadata');
      });

      videoView.addEventListener('resize', () => {
        updateVideoMeta();
        pushLog('远端视频尺寸变化', { width: videoView.videoWidth, height: videoView.videoHeight });
      });

      videoView.addEventListener('playing', () => {
        setLiveState(true);
        updateVideoMeta();
        pushLog('远端视频开始播放');
      });

      function pushLog(message, payload) {
        const timestamp = new Date().toLocaleTimeString();
        let line = `[${timestamp}] ${message}`;

        if (payload !== undefined) {
          try {
            line += ` ${JSON.stringify(payload)}`;
          } catch {
            line += ` ${String(payload)}`;
          }
        }

        debugLines.push(line);
        if (debugLines.length > 40) {
          debugLines = debugLines.slice(-40);
        }

        debugLog.textContent = debugLines.join('\n');
        debugLog.scrollTop = debugLog.scrollHeight;
        console.log('[viewer]', message, payload ?? '');
      }

      function setLiveState(isLive) {
        statusDot.classList.toggle('live', isLive);
        statusLabel.textContent = isLive ? '直播中' : '等待直播';
      }

      function setPublisherState(text) {
        publisherState.textContent = text;
      }

      function setConnectionText(text) {
        connectionState.textContent = text;
      }

      function setRTCText(text) {
        rtcState.textContent = text;
      }

      function resetFrameView() {
        videoView.pause();
        videoView.removeAttribute('src');
        videoView.srcObject = null;
        videoView.hidden = true;
        emptyState.hidden = false;
        lastFrameMeta.textContent = '暂无';
        pushLog('已重置画面显示');
      }

      function closePeerConnection() {
        if (peerConnection) {
          peerConnection.onicecandidate = null;
          peerConnection.onconnectionstatechange = null;
          peerConnection.ontrack = null;
          peerConnection.close();
          peerConnection = null;
        }

        hasRemoteDescription = false;
        pendingCandidates = [];
        setRTCText('未建立');
        resetFrameView();
        pushLog('PeerConnection 已关闭');
      }

      function closeSocket() {
        if (signalingSocket) {
          signalingSocket.onclose = null;
          signalingSocket.close();
          signalingSocket = null;
          pushLog('Signaling WebSocket 已关闭');
        }
      }

      function closeConnection() {
        closePeerConnection();
        closeSocket();
        currentPublisherId = null;
      }

      function attachRemoteTrack(track, streams) {
        const remoteStream = streams[0] || new MediaStream([track]);
        videoView.srcObject = remoteStream;
        videoView.hidden = false;
        emptyState.hidden = true;
        setPublisherState('已连接');
        setRTCText('视频轨道已连接');
        pushLog('收到远端视频轨道', {
          trackId: track.id,
          kind: track.kind,
          streamId: remoteStream.id,
        });

        track.onunmute = () => {
          setLiveState(true);
          pushLog('远端视频轨道解除静音', { trackId: track.id });
          attemptVideoPlayback('track-unmute');
        };

        track.onmute = () => {
          setLiveState(false);
          pushLog('远端视频轨道静音', { trackId: track.id });
        };

        track.onended = () => {
          setLiveState(false);
          pushLog('远端视频轨道结束', { trackId: track.id });
        };

        attemptVideoPlayback('track-attached');
      }

      function sendSignal(targetId, signal) {
        if (!signalingSocket || signalingSocket.readyState !== WebSocket.OPEN) {
          pushLog('signal 发送失败，WebSocket 未连接', { targetId, signalType: signal.type });
          return;
        }

        pushLog('发送 signal', { targetId, signalType: signal.type });

        signalingSocket.send(
          JSON.stringify({
            type: 'signal',
            targetId,
            signal,
          })
        );
      }

      function buildSignalUrl(baseUrl, roomId, token) {
        const url = new URL(baseUrl);

        if (url.protocol === 'http:') {
          url.protocol = 'ws:';
        }

        if (url.protocol === 'https:') {
          url.protocol = 'wss:';
        }

        url.searchParams.set('type', 'viewer');
        url.searchParams.set('roomId', roomId);
        if (token) {
          url.searchParams.set('token', token);
        }

        return url;
      }

      function ensurePeerConnection(publisherId) {
        if (peerConnection && currentPublisherId === publisherId) {
          pushLog('复用已有 PeerConnection', { publisherId });
          return peerConnection;
        }

        const preservedCandidates = !peerConnection && currentPublisherId === publisherId ? pendingCandidates : [];
        closePeerConnection();
        pendingCandidates = preservedCandidates;
        currentPublisherId = publisherId;
        pushLog('创建新的 PeerConnection', { publisherId });

        peerConnection = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
        });

        peerConnection.onicecandidate = (event) => {
          if (!event.candidate || !currentPublisherId) {
            return;
          }

          pushLog('生成本地 ICE candidate', { publisherId: currentPublisherId });

          sendSignal(currentPublisherId, {
            type: 'candidate',
            candidate: event.candidate.toJSON(),
          });
        };

        peerConnection.ontrack = (event) => {
          attachRemoteTrack(event.track, event.streams);
        };

        peerConnection.onconnectionstatechange = () => {
          const state = peerConnection.connectionState;
          const labelMap = {
            new: '准备中',
            connecting: '连接中',
            connected: '已连接',
            disconnected: '已断开',
            failed: '失败',
            closed: '已关闭',
          };

          setRTCText(labelMap[state] || state);
          pushLog('PeerConnection 状态变化', { state });

          if (state === 'failed' || state === 'disconnected' || state === 'closed') {
            setLiveState(false);
          }
        };

        return peerConnection;
      }

      async function flushPendingCandidates() {
        if (!peerConnection || !hasRemoteDescription) {
          return;
        }

        if (pendingCandidates.length > 0) {
          pushLog('开始补发缓存 ICE candidate', { count: pendingCandidates.length });
        }

        while (pendingCandidates.length > 0) {
          const candidate = pendingCandidates.shift();
          await peerConnection.addIceCandidate(candidate);
        }
      }

      connectButton.addEventListener('click', () => {
        debugLines = [];
        pushLog('开始连接查看端');
        closeConnection();
        setLiveState(false);
        setPublisherState('未检测到');
        setRTCText('等待信令');

        const baseUrl = serverUrlInput.value.trim().replace(/\/$/, '');
        const roomId = roomIdInput.value.trim() || 'demo-room';
        const token = tokenInput.value.trim();
        const url = buildSignalUrl(baseUrl, roomId, token);
        pushLog('准备连接信令服务', { url: url.toString(), roomId, hasToken: Boolean(token) });

        viewerTitle.textContent = `房间 ${roomId}`;
        setConnectionText('信令连接中');
        signalingSocket = new WebSocket(url);

        signalingSocket.onopen = () => {
          setConnectionText('信令已连接');
          pushLog('Signaling WebSocket 已打开');
        };

        signalingSocket.onmessage = async (event) => {
          const message = JSON.parse(event.data);
          pushLog('收到服务端消息', {
            type: message.type,
            signalType: message.signal?.type,
            sourceId: message.sourceId,
            publisherId: message.publisherId,
          });

          if (message.type === 'room_state') {
            setPublisherState(message.hasPublisher ? '已连接' : '未检测到');
            viewerCount.textContent = String(message.viewerCount || 0);
            if (message.publisherId) {
              currentPublisherId = message.publisherId;
            }
            if (!message.hasPublisher) {
              closePeerConnection();
              setLiveState(false);
            }
            return;
          }

          if (message.type === 'viewer_ready') {
            setPublisherState(message.hasPublisher ? '已连接' : '未检测到');
            viewerCount.textContent = String(message.viewerCount || 0);
            currentPublisherId = message.publisherId || null;
            setRTCText(message.hasPublisher ? '等待视频 offer' : '等待发布端');
            pushLog('查看端已注册', { hasPublisher: message.hasPublisher, publisherId: message.publisherId });
            return;
          }

          if (message.type === 'signal') {
            currentPublisherId = message.sourceId;

            if (message.signal.type === 'offer') {
              pushLog('收到 offer', { sourceId: message.sourceId, sdpLength: message.signal.sdp?.length || 0 });
              const connection = ensurePeerConnection(message.sourceId);
              await connection.setRemoteDescription({
                type: 'offer',
                sdp: message.signal.sdp,
              });
              hasRemoteDescription = true;
              pushLog('已设置远端 offer');
              await flushPendingCandidates();

              const answer = await connection.createAnswer();
              await connection.setLocalDescription(answer);
              sendSignal(message.sourceId, {
                type: 'answer',
                sdp: answer.sdp,
              });
              setRTCText('已发送 answer，等待视频流');
              pushLog('已创建并发送 answer', { sdpLength: answer.sdp?.length || 0 });
            }

            if (message.signal.type === 'candidate') {
              const candidate = new RTCIceCandidate(message.signal.candidate);
              if (peerConnection && hasRemoteDescription) {
                await peerConnection.addIceCandidate(candidate);
                pushLog('已添加远端 ICE candidate');
              } else {
                pendingCandidates.push(candidate);
                pushLog('远端 ICE candidate 已缓存', { pending: pendingCandidates.length });
              }
            }

            return;
          }

          if (message.type === 'publisher_left') {
            closePeerConnection();
            currentPublisherId = null;
            setPublisherState('未检测到');
            setLiveState(false);
            pushLog('发布端已离开');
            return;
          }

          if (message.type === 'error') {
            setConnectionText(`错误: ${message.message}`);
            pushLog('服务端返回错误', { message: message.message });
          }
        };

        signalingSocket.onerror = (event) => {
          setConnectionText('信令异常');
          pushLog('Signaling WebSocket 异常', { type: event.type });
        };

        signalingSocket.onclose = () => {
          closePeerConnection();
          setConnectionText('已断开');
          setPublisherState('未检测到');
          setLiveState(false);
          pushLog('Signaling WebSocket 已断开');
        };
      });
    </script>
  </body>
  </html>
