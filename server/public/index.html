<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iOS Screen Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5efe4;
        --surface: rgba(255, 252, 246, 0.92);
        --surface-strong: rgba(255, 255, 255, 0.98);
        --ink: #16233a;
        --muted: #5b6778;
        --accent: #ef6c3d;
        --accent-soft: #ffd8c9;
        --line: rgba(22, 35, 58, 0.12);
        --ok: #1d8a5f;
        --warn: #b26d00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Avenir Next", "Helvetica Neue", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(239, 108, 61, 0.16), transparent 28%),
          radial-gradient(circle at 85% 15%, rgba(29, 138, 95, 0.12), transparent 22%),
          linear-gradient(180deg, #fbf6ec 0%, var(--bg) 100%);
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .hero {
        display: grid;
        gap: 20px;
        margin-bottom: 24px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(30px, 6vw, 58px);
        line-height: 0.95;
        letter-spacing: -0.04em;
        max-width: 10ch;
      }

      .hero p {
        margin: 0;
        max-width: 58ch;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .panel-grid {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 20px;
      }

      .panel,
      .viewer {
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        backdrop-filter: blur(18px);
        box-shadow: 0 18px 45px rgba(22, 35, 58, 0.08);
      }

      .panel {
        padding: 22px;
      }

      .viewer {
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 70vh;
      }

      .viewer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-strong);
      }

      .viewer-stage {
        padding: 18px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(22, 35, 58, 0.02), rgba(22, 35, 58, 0.08)),
          repeating-linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.3),
            rgba(255, 255, 255, 0.3) 14px,
            rgba(255, 255, 255, 0.18) 14px,
            rgba(255, 255, 255, 0.18) 28px
          );
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--warn);
        box-shadow: 0 0 0 5px rgba(178, 109, 0, 0.12);
      }

      .dot.live {
        background: var(--ok);
        box-shadow: 0 0 0 5px rgba(29, 138, 95, 0.12);
      }

      label {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
        font-size: 14px;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px 14px;
        font: inherit;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.82);
      }

      button {
        width: 100%;
        padding: 14px 18px;
        border: 0;
        border-radius: 18px;
        font: inherit;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent), #ff965a);
        color: white;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .meta {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
        color: var(--muted);
        font-size: 14px;
      }

      .meta strong {
        color: var(--ink);
      }

      img {
        width: 100%;
        max-height: calc(70vh - 90px);
        object-fit: contain;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      .empty {
        display: grid;
        gap: 12px;
        text-align: center;
        padding: 32px;
        color: var(--muted);
      }

      .empty strong {
        font-size: 20px;
        color: var(--ink);
      }

      @media (max-width: 920px) {
        .panel-grid {
          grid-template-columns: 1fr;
        }

        .viewer {
          min-height: 58vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>iPhone 当前屏幕实时查看</h1>
        <p>
          这个页面作为查看端。iOS App 启动屏幕广播后，Broadcast Extension 会通过 WebRTC DataChannel 把 JPEG 帧发送到浏览器，这里实时展示最新画面。
        </p>
      </section>

      <section class="panel-grid">
        <aside class="panel">
          <label>
            服务端地址
            <input id="serverUrl" />
          </label>
          <label>
            房间 ID
            <input id="roomId" value="demo-room" />
          </label>
          <label>
            Token
            <input id="token" placeholder="可选，需与服务端环境变量一致" />
          </label>
          <button id="connectButton">连接查看</button>

          <div class="meta">
            <div>信令状态: <strong id="connectionState">未连接</strong></div>
            <div>发布端状态: <strong id="publisherState">未检测到</strong></div>
            <div>WebRTC 状态: <strong id="rtcState">未建立</strong></div>
            <div>查看人数: <strong id="viewerCount">0</strong></div>
            <div>最新帧: <strong id="lastFrameMeta">暂无</strong></div>
          </div>
        </aside>

        <section class="viewer">
          <div class="viewer-head">
            <strong id="viewerTitle">房间 demo-room</strong>
            <span class="badge"><span id="statusDot" class="dot"></span><span id="statusLabel">等待直播</span></span>
          </div>
          <div class="viewer-stage">
            <div id="emptyState" class="empty">
              <strong>还没有收到画面</strong>
              <span>先在 iOS 端保存服务端地址，再从控制中心启动屏幕广播。</span>
            </div>
            <img id="frameView" hidden alt="Live screen frame" />
          </div>
        </section>
      </section>
    </main>

    <script>
      const serverUrlInput = document.getElementById('serverUrl');
      const roomIdInput = document.getElementById('roomId');
      const tokenInput = document.getElementById('token');
      const connectButton = document.getElementById('connectButton');
      const connectionState = document.getElementById('connectionState');
      const publisherState = document.getElementById('publisherState');
      const rtcState = document.getElementById('rtcState');
      const viewerCount = document.getElementById('viewerCount');
      const lastFrameMeta = document.getElementById('lastFrameMeta');
      const frameView = document.getElementById('frameView');
      const emptyState = document.getElementById('emptyState');
      const viewerTitle = document.getElementById('viewerTitle');
      const statusDot = document.getElementById('statusDot');
      const statusLabel = document.getElementById('statusLabel');

      let signalingSocket;
      let peerConnection;
      let frameChannel;
      let currentPublisherId = null;
      let hasRemoteDescription = false;
      let pendingCandidates = [];

      function defaultServerUrl() {
        return window.location.origin;
      }

      serverUrlInput.value = defaultServerUrl();

      function setLiveState(isLive) {
        statusDot.classList.toggle('live', isLive);
        statusLabel.textContent = isLive ? '直播中' : '等待直播';
      }

      function setPublisherState(text) {
        publisherState.textContent = text;
      }

      function setConnectionText(text) {
        connectionState.textContent = text;
      }

      function setRTCText(text) {
        rtcState.textContent = text;
      }

      function resetFrameView() {
        frameView.removeAttribute('src');
        frameView.hidden = true;
        emptyState.hidden = false;
        lastFrameMeta.textContent = '暂无';
      }

      function closePeerConnection() {
        if (frameChannel) {
          frameChannel.onopen = null;
          frameChannel.onclose = null;
          frameChannel.onerror = null;
          frameChannel.onmessage = null;
          frameChannel = null;
        }

        if (peerConnection) {
          peerConnection.onicecandidate = null;
          peerConnection.onconnectionstatechange = null;
          peerConnection.ondatachannel = null;
          peerConnection.close();
          peerConnection = null;
        }

        hasRemoteDescription = false;
        pendingCandidates = [];
        setRTCText('未建立');
      }

      function closeSocket() {
        if (signalingSocket) {
          signalingSocket.onclose = null;
          signalingSocket.close();
          signalingSocket = null;
        }
      }

      function closeConnection() {
        closePeerConnection();
        closeSocket();
        currentPublisherId = null;
      }

      function attachFrameChannel(channel) {
        frameChannel = channel;

        frameChannel.onopen = () => {
          setRTCText('DataChannel 已连接');
          setConnectionText('信令已连接');
        };

        frameChannel.onclose = () => {
          setRTCText('DataChannel 已关闭');
        };

        frameChannel.onerror = () => {
          setRTCText('DataChannel 异常');
        };

        frameChannel.onmessage = (event) => {
          const text = typeof event.data === 'string' ? event.data : new TextDecoder().decode(event.data);
          const message = JSON.parse(text);

          if (message.type !== 'frame') {
            return;
          }

          const dataUrl = `data:${message.mimeType};base64,${message.imageData}`;
          frameView.src = dataUrl;
          frameView.hidden = false;
          emptyState.hidden = true;
          lastFrameMeta.textContent = `${message.width || '?'} x ${message.height || '?'} / ${new Date(message.timestamp).toLocaleTimeString()}`;
          setLiveState(true);
          setPublisherState('已连接');
        };
      }

      function sendSignal(targetId, signal) {
        if (!signalingSocket || signalingSocket.readyState !== WebSocket.OPEN) {
          return;
        }

        signalingSocket.send(
          JSON.stringify({
            type: 'signal',
            targetId,
            signal,
          })
        );
      }

      function buildSignalUrl(baseUrl, roomId, token) {
        const url = new URL(baseUrl);

        if (url.protocol === 'http:') {
          url.protocol = 'ws:';
        }

        if (url.protocol === 'https:') {
          url.protocol = 'wss:';
        }

        url.searchParams.set('type', 'viewer');
        url.searchParams.set('roomId', roomId);
        if (token) {
          url.searchParams.set('token', token);
        }

        return url;
      }

      function ensurePeerConnection(publisherId) {
        if (peerConnection && currentPublisherId === publisherId) {
          return peerConnection;
        }

        const preservedCandidates = !peerConnection && currentPublisherId === publisherId ? pendingCandidates : [];
        closePeerConnection();
        pendingCandidates = preservedCandidates;
        currentPublisherId = publisherId;

        peerConnection = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
        });

        peerConnection.onicecandidate = (event) => {
          if (!event.candidate || !currentPublisherId) {
            return;
          }

          sendSignal(currentPublisherId, {
            type: 'candidate',
            candidate: event.candidate.toJSON(),
          });
        };

        peerConnection.ondatachannel = (event) => {
          attachFrameChannel(event.channel);
        };

        peerConnection.onconnectionstatechange = () => {
          const state = peerConnection.connectionState;
          const labelMap = {
            new: '准备中',
            connecting: '连接中',
            connected: '已连接',
            disconnected: '已断开',
            failed: '失败',
            closed: '已关闭',
          };

          setRTCText(labelMap[state] || state);

          if (state === 'failed' || state === 'disconnected' || state === 'closed') {
            setLiveState(false);
          }
        };

        return peerConnection;
      }

      async function flushPendingCandidates() {
        if (!peerConnection || !hasRemoteDescription) {
          return;
        }

        while (pendingCandidates.length > 0) {
          const candidate = pendingCandidates.shift();
          await peerConnection.addIceCandidate(candidate);
        }
      }

      connectButton.addEventListener('click', () => {
        closeConnection();
        resetFrameView();
        setLiveState(false);
        setPublisherState('未检测到');
        setRTCText('等待信令');

        const baseUrl = serverUrlInput.value.trim().replace(/\/$/, '');
        const roomId = roomIdInput.value.trim() || 'demo-room';
        const token = tokenInput.value.trim();
        const url = buildSignalUrl(baseUrl, roomId, token);

        viewerTitle.textContent = `房间 ${roomId}`;
        setConnectionText('信令连接中');
        signalingSocket = new WebSocket(url);

        signalingSocket.onopen = () => {
          setConnectionText('信令已连接');
        };

        signalingSocket.onmessage = async (event) => {
          const message = JSON.parse(event.data);

          if (message.type === 'room_state') {
            setPublisherState(message.hasPublisher ? '已连接' : '未检测到');
            viewerCount.textContent = String(message.viewerCount || 0);
            if (message.publisherId) {
              currentPublisherId = message.publisherId;
            }
            if (!message.hasPublisher) {
              closePeerConnection();
              setLiveState(false);
            }
            return;
          }

          if (message.type === 'viewer_ready') {
            setPublisherState(message.hasPublisher ? '已连接' : '未检测到');
            viewerCount.textContent = String(message.viewerCount || 0);
            currentPublisherId = message.publisherId || null;
            setRTCText(message.hasPublisher ? '等待 offer' : '等待发布端');
            return;
          }

          if (message.type === 'signal') {
            currentPublisherId = message.sourceId;

            if (message.signal.type === 'offer') {
              const connection = ensurePeerConnection(message.sourceId);
              await connection.setRemoteDescription({
                type: 'offer',
                sdp: message.signal.sdp,
              });
              hasRemoteDescription = true;
              await flushPendingCandidates();

              const answer = await connection.createAnswer();
              await connection.setLocalDescription(answer);
              sendSignal(message.sourceId, {
                type: 'answer',
                sdp: answer.sdp,
              });
              setRTCText('已发送 answer');
            }

            if (message.signal.type === 'candidate') {
              const candidate = new RTCIceCandidate(message.signal.candidate);
              if (peerConnection && hasRemoteDescription) {
                await peerConnection.addIceCandidate(candidate);
              } else {
                pendingCandidates.push(candidate);
              }
            }

            return;
          }

          if (message.type === 'publisher_left') {
            closePeerConnection();
            currentPublisherId = null;
            setPublisherState('未检测到');
            setLiveState(false);
            return;
          }

          if (message.type === 'error') {
            setConnectionText(`错误: ${message.message}`);
          }
        };

        signalingSocket.onerror = () => {
          setConnectionText('信令异常');
        };

        signalingSocket.onclose = () => {
          closePeerConnection();
          setConnectionText('已断开');
          setPublisherState('未检测到');
          setLiveState(false);
        };
      });
    </script>
  </body>
  </html>
